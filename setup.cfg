[metadata]
name = async_reduce
# version = < see setup.py >
description = Reducer for similar simultaneously coroutines
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/sirkonst/async-reduce
author = Konstantin Enchant
author_email = sirkonst@gmail.com
maintainer = Konstantin Enchant
maintainer_email = sirkonst@gmail.com
keywords = asyncio, reduce
license = MIT
classifiers =
    Development Status :: 5 - Production/Stable
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15

[options]
python_requires = >=3.7
packages = find:
install_requires =

[options.packages.find]
exclude =
    tests

[options.extras_require]
develop =
    tox~=4.23
    wheel~=0.45
    twine~=6.0
testing =
    pytest~=7.2; python_version<="3.13"
    pytest~=9.1; python_version>="3.14"
    pytest-asyncio~=0.20; python_version<="3.13"
    pytest-asyncio~=1.4; python_version>="3.14"
    coverage~=7.0; python_version<="3.13"
    coverage~=7.16; python_version>="3.14"
    mypy~=0.991; python_version<="3.13"
    mypy~=2.4.0; python_version>="3.14"
